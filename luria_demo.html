const fmtVal = (k,v) => {
  const i = IND[k]; if(!i) return v.toFixed(3);
  if(i.unit==="PERCENTUAL") return `${(v*100).toFixed(1)}%`;
  if(i.unit==="MOEDA") return `R$${(v/1e6).toFixed(1)}M`;
  return v.toFixed(2);
};

const isGd = (k,v) => {
  const i = IND[k]; if(!i||i.thr===undefined) return null;
  return i.hb ? v>=i.thr : v<=i.thr;
};

const getArr = (k) => {
  if(MD[k]) return {labels:MONTHS,vals:MD[k]};
  if(QD[k]) return {labels:QUARTERS,vals:QD[k]};
  return {labels:[],vals:[]};
};

const mkChart = (k) => {
  const {labels,vals} = getArr(k);
  return labels.map((l,i)=>({l,v:vals[i]}));
};

// ── COMPONENTS ───────────────────────────────────────────────────────────────

function Spark({data,pos}) {
  const w=80,h=32,mn=Math.min(...data),mx=Math.max(...data),r=mx-mn||1;
  const pts=data.map((v,i)=>`${((i/(data.length-1))*w).toFixed(1)},${(h-((v-mn)/r)*h).toFixed(1)}`).join(' ');
  const clr=pos?'#10b981':'#ef4444';
  return <svg width={w} height={h} style={{display:'block'}}>
    <polyline points={pts} fill="none" stroke={clr} strokeWidth="1.5" strokeLinejoin="round"/>
  </svg>;
}

function MiniChart({k}) {
  const ind=IND[k]; if(!ind) return null;
  const cd=mkChart(k); if(!cd.length) return null;
  const vals=cd.map(d=>d.v), last=vals[vals.length-1];
  const mn=Math.min(...vals), mx=Math.max(...vals), thr=ind.thr;
  const good=isGd(k,last);
  const clr=good===null?'#0ea5e9':good?'#10b981':'#ef4444';
  const yMn=thr!==undefined?Math.min(mn,thr)*.88:mn*.9;
  const yMx=thr!==undefined?Math.max(mx,thr)*1.1:mx*1.1;

  const TT=({active,payload,label})=>{
    if(!active||!payload?.length) return null;
    return <div style={{background:'#1a2845',border:'1px solid #2d4a70',borderRadius:6,padding:'6px 10px',fontSize:11}}>
      <div style={{color:'#64748b',marginBottom:2}}>{label}</div>
      <div style={{color:clr,fontWeight:700}}>{fmtVal(k,payload[0].value)}</div>
    </div>;
  };

  return <div className="card" style={{padding:12}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
      <div>
        <div style={{fontSize:10,color:BLOCO_CLR[ind.bloco]||'#64748b',fontWeight:700,marginBottom:2,letterSpacing:.5}}>{ind.bloco}</div>
        <div style={{fontSize:11,fontWeight:500,color:'#e2e8f0',lineHeight:1.3}}>{ind.name}</div>
      </div>
      <div style={{textAlign:'right'}}>
        <div style={{fontSize:15,fontWeight:800,color:clr}}>{fmtVal(k,last)}</div>
        <div style={{fontSize:9,color:'#475569',marginTop:1}}>{ind.hb?'↑ maior=melhor':'↓ menor=melhor'}</div>
      </div>
    </div>
    <ResponsiveContainer width="100%" height={72}>
      <AreaChart data={cd} margin={{top:2,right:0,left:0,bottom:0}}>
        <defs>
          <linearGradient id={`g${k.replace(/[^a-z]/g,'')}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="5%" stopColor={clr} stopOpacity={.3}/>
            <stop offset="95%" stopColor={clr} stopOpacity={0}/>
          </linearGradient>
        </defs>
        {thr!==undefined && <>
          {ind.hb
            ? <><ReferenceArea y1={yMn} y2={thr} fill="rgba(239,68,68,.08)"/>
                <ReferenceArea y1={thr} y2={yMx} fill="rgba(16,185,129,.08)"/></>
            : <><ReferenceArea y1={yMn} y2={thr} fill="rgba(16,185,129,.08)"/>
                <ReferenceArea y1={thr} y2={yMx} fill="rgba(239,68,68,.08)"/></>
          }
          <ReferenceLine y={thr} stroke="rgba(234,179,8,.7)" strokeDasharray="3 2" strokeWidth={1}/>
        </>}
        <XAxis dataKey="l" hide/><YAxis domain={[yMn,yMx]} hide/>
        <Tooltip content={TT}/>
        <Area type="monotone" dataKey="v" stroke={clr} strokeWidth={1.5}
          fill={`url(#g${k.replace(/[^a-z]/g,'')})`} dot={false}
          activeDot={{r:3,fill:clr,stroke:'#080d1a',strokeWidth:2}}/>
      </AreaChart>
    </ResponsiveContainer>
    {thr!==undefined && <div style={{display:'flex',alignItems:'center',gap:4,marginTop:4}}>
      <div style={{width:12,height:1,background:'rgba(234,179,8,.7)'}}/>
      <span style={{fontSize:9,color:'#475569'}}>limiar {fmtVal(k,thr)}</span>
    </div>}
  </div>;
}

function StockCard({s,onClick}) {
  const sc=s.score>=85?'score-h':s.score>=70?'score-m':'score-l';
  return <div className="card" style={{cursor:'pointer',transition:'border-color .2s'}}
    onClick={onClick}
    onMouseEnter={e=>e.currentTarget.style.borderColor='#0ea5e9'}
    onMouseLeave={e=>e.currentTarget.style.borderColor='#1e2d4a'}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
      <div>
        <div style={{fontWeight:800,fontSize:15,color:'#f1f5f9'}}>{s.ticker}</div>
        <div style={{fontSize:11,color:'#475569',marginTop:2,lineHeight:1.3}}>{s.emp}</div>
      </div>
      <div className={`score-ring ${sc}`}>{s.score}</div>
    </div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
      <div>
        <div style={{fontSize:13,fontWeight:700,color:'#f1f5f9'}}>{s.preco}</div>
        <span className={`badge badge-${s.pos?'green':'red'}`} style={{marginTop:4,display:'inline-block'}}>{s.var1d}</span>
      </div>
      <Spark data={s.trend} pos={s.pos}/>
    </div>
    <div style={{marginTop:8}}>
      <span style={{fontSize:10,fontWeight:500,padding:'2px 8px',borderRadius:4,background:'#1a2845',color:'#475569'}}>{s.setor}</span>
    </div>
  </div>;
}

      {['acoes','fiis'].map(t=>(
        <button key={t} onClick={()=>setTab(t)} style={{
          padding:'10px 36px',borderRadius:10,border:'1px solid',fontSize:14,
          fontWeight:700,transition:'all .2s',
          borderColor:tab===t?'#0ea5e9':'#1e2d4a',
          background:tab===t?'rgba(14,165,233,.12)':'transparent',
          color:tab===t?'#0ea5e9':'#475569'
        }}>{t==='acoes'?'Ações':'FIIs'}</button>
      ))}
    </div>

    {/* Search */}
    <div style={{position:'relative',marginBottom:32}}>
      <div style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:14,color:'#374151'}}>🔍</div>
      <input type="text" value={q} onChange={e=>handle(e.target.value)}
        placeholder="Buscar ativo... ex: WEGE3, VALE3" style={{paddingLeft:36}}/>
      {sugg.length>0 && <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,
        background:'#0f1629',border:'1px solid #1e2d4a',borderRadius:10,overflow:'hidden',zIndex:100}}>
        {sugg.map(s=><div key={s.ticker} onClick={()=>onNav('asset',{ticker:s.ticker,emp:s.emp})}
          style={{padding:'10px 16px',cursor:'pointer',fontSize:13,color:'#e2e8f0',
            display:'flex',alignItems:'center',gap:8}}
          onMouseEnter={e=>e.currentTarget.style.background='#1a2845'}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
          <span style={{fontWeight:700,color:'#f1f5f9'}}>{s.ticker}</span>
          <span style={{color:'#374151',fontSize:11}}>·</span>
          <span style={{color:'#475569',fontSize:12}}>{s.emp}</span>
        </div>)}
      </div>}
    </div>

    {/* Best header */}
    <div style={{marginBottom:14}}>
      <div style={{fontSize:15,fontWeight:700,color:'#f1f5f9'}}>
        {tab==='acoes'?'Melhores Ações':'Melhores FIIs'}
      </div>
      <div style={{fontSize:11,color:'#374151',marginTop:3}}>
        Rankeados por score composto — fundamentalistas + quantitativos
      </div>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      {BEST.map(s=><StockCard key={s.ticker} s={s} onClick={()=>onNav('asset',{ticker:s.ticker,emp:s.emp})}/>)}
    </div>
  </div>;
}

// ── ASSET PAGE ────────────────────────────────────────────────────────────────

function AssetPage({ticker,emp,onBack}) {
  const [mainK,setMainK]=useState('bp_liquidez_corrente');
  const [ctype,setCtype]=useState('line');
  const [showSel,setShowSel]=useState(false);
  const [selMini,setSelMini]=useState([
    'dre_margem_liquida','cmb_roe','bp_passivo_sobre_ativo',
    'dre_cobertura_juros','mkt_sharpe_252d','mkt_sortino_252d'
  ]);
  const [sSearch,setSSearch]=useState('');

  const cd=mkChart(mainK);
  const ind=IND[mainK];
  const vals=cd.map(d=>d.v);
  const last=vals[vals.length-1];
  const thr=ind?.thr;
  const good=thr!==undefined?isGd(mainK,last):null;
  const clr=good===null?'#0ea5e9':good?'#10b981':'#ef4444';
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const yMn=thr!==undefined?Math.min(mn,thr)*.85:mn*.9;
  const yMx=thr!==undefined?Math.max(mx,thr)*1.12:mx*1.1;

  const TT=({active,payload,label})=>{
    if(!active||!payload?.length) return null;
    return <div style={{background:'#1a2845',border:'1px solid #253a5e',borderRadius:8,padding:'10px 14px',fontSize:12}}>
      <div style={{color:'#475569',marginBottom:4}}>{label}</div>
      <div style={{color:clr,fontWeight:800,fontSize:16}}>{fmtVal(mainK,payload[0].value)}</div>
      {thr!==undefined&&<div style={{color:'#374151',fontSize:10,marginTop:2}}>limiar {fmtVal(mainK,thr)}</div>}
    </div>;
  };

  const filtInds=Object.entries(IND).filter(([k,v])=>
    (k.toLowerCase().includes(sSearch.toLowerCase())||
     v.name.toLowerCase().includes(sSearch.toLowerCase())) &&
    getArr(k).vals.length>0
  );

  const toggleMini=k=>setSelMini(p=>p.includes(k)?p.filter(x=>x!==k):[...p,k]);

  return <div style={{maxWidth:480,margin:'0 auto',padding:'0 16px 48px'}}>
    {/* Header */}
    <div style={{display:'flex',alignItems:'center',gap:12,padding:'18px 0 20px'}}>
      <button onClick={onBack} style={{background:'#0f1629',border:'1px solid #1e2d4a',
        borderRadius:8,padding:'7px 14px',color:'#64748b',fontSize:13,fontWeight:500}}>← Voltar</button>
      <div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:17,fontWeight:800,color:'#f1f5f9'}}>{emp||'WEG S.A.'}</span>
          <span className="badge badge-blue">{ticker}</span>
        </div>
        <div style={{fontSize:11,color:'#374151',marginTop:2}}>Bens de Capital · B3 · Câmbio: R$5,82</div>
      </div>
    </div>

    {/* KPIs */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:16}}>
      {[
        {label:'Score Geral',val:'92',clr:'#10b981'},
        {label:'Retorno 12m',val:'+48%',clr:'#10b981'},
        {label:'Sharpe 252d',val:'1.14',clr:'#0ea5e9'},
      ].map(m=><div key={m.label} style={{background:'#0f1629',border:'1px solid #1e2d4a',
        borderRadius:10,padding:'10px 12px',textAlign:'center'}}>
        <div style={{fontSize:10,color:'#374151',marginBottom:4}}>{m.label}</div>
        <div style={{fontSize:20,fontWeight:900,color:m.clr}}>{m.val}</div>
      </div>)}
    </div>

    {/* AI Analysis */}
    <div style={{background:'linear-gradient(135deg,rgba(14,165,233,.07),rgba(16,185,129,.07))',
      border:'1px solid rgba(14,165,233,.18)',borderRadius:12,padding:16,marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        <div style={{width:22,height:22,borderRadius:6,
          background:'linear-gradient(135deg,#0ea5e9,#10b981)',
          display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,flexShrink:0}}>✦</div>
        <span style={{fontSize:12,fontWeight:700,color:'#0ea5e9',letterSpacing:.3}}>Análise Luria</span>
      </div>
      <p style={{fontSize:13,color:'#cbd5e1',lineHeight:1.75,margin:0}}>
        <strong style={{color:'#f1f5f9'}}>WEGE3</strong> apresenta fundamentos excepcionais entre as industriais brasileiras.
        A <span style={{color:'#10b981',fontWeight:600}}>liquidez corrente de 4.52×</span> é mais que o dobro do limiar de segurança,
        indicando posição financeira extremamente sólida. O <span style={{color:'#10b981',fontWeight:600}}>ROE de 47.8%</span> e
        a <span style={{color:'#10b981',fontWeight:600}}>margem líquida de 20.8%</span> — ambos em crescimento contínuo desde 2020 —
        refletem eficiência operacional de primeira linha. Quantitativamente, o Sharpe de 1.14
        e o Sortino de 1.62 confirmam retorno ajustado ao risco muito acima da média do Ibovespa.
        O alavancagem (passivo/ativo de 0.40) segue em queda, reduzindo risco sistêmico.
      </p>
    </div>

    {/* Main Chart */}
    <div className="card" style={{marginBottom:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
        <select value={mainK} onChange={e=>setMainK(e.target.value)} style={{flex:1,minWidth:160}}>
          {BLOCOS.map(b=><optgroup key={b} label={b}>
            {Object.entries(IND).filter(([_,v])=>v.bloco===b&&getArr(_).vals.length>0)
              .map(([k,v])=><option key={k} value={k}>{v.name}</option>)}
          </optgroup>)}
        </select>
        <div style={{display:'flex',gap:4}}>
          {['line','bar'].map(t=><button key={t} onClick={()=>setCtype(t)} style={{
            padding:'7px 12px',borderRadius:8,border:'1px solid',fontSize:12,fontWeight:600,
            borderColor:ctype===t?'#0ea5e9':'#1e2d4a',
            background:ctype===t?'rgba(14,165,233,.15)':'transparent',
            color:ctype===t?'#0ea5e9':'#475569'
          }}>{t==='line'?'〜 Linha':'▊ Barra'}</button>)}
        </div>
      </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:14}}>
        <div>
          <div style={{fontSize:30,fontWeight:900,color:clr}}>{fmtVal(mainK,last)}</div>
          <div style={{fontSize:12,color:'#374151',marginTop:2}}>{ind?.name}</div>
        </div>
        {thr!==undefined && <div style={{textAlign:'right'}}>
          <div style={{display:'flex',alignItems:'center',gap:5,justifyContent:'flex-end'}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:good?'#10b981':'#ef4444'}}/>
            <span style={{fontSize:12,fontWeight:700,color:good?'#10b981':'#ef4444'}}>
              {good?(ind.hb?'Acima do limiar':'Abaixo do limiar'):(ind.hb?'Abaixo do limiar':'Acima do limiar')}
            </span>
          </div>
          <div style={{fontSize:10,color:'#374151',marginTop:2}}>Limiar: {fmtVal(mainK,thr)}</div>
        </div>}
      </div>

      <ResponsiveContainer width="100%" height={210}>
        {ctype==='line'
          ? <AreaChart data={cd} margin={{top:6,right:4,left:0,bottom:0}}>
              <defs>
                <linearGradient id="mainG" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor={clr} stopOpacity={.28}/>
                  <stop offset="95%" stopColor={clr} stopOpacity={0}/>
                </linearGradient>
              </defs>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,.03)"/>
              {thr!==undefined && <>
                {ind.hb
                  ? <><ReferenceArea y1={yMn} y2={thr} fill="rgba(239,68,68,.06)"/>
                      <ReferenceArea y1={thr} y2={yMx} fill="rgba(16,185,129,.06)"/></>
                  : <><ReferenceArea y1={yMn} y2={thr} fill="rgba(16,185,129,.06)"/>
                      <ReferenceArea y1={thr} y2={yMx} fill="rgba(239,68,68,.06)"/></>
                }
                <ReferenceLine y={thr} stroke="#eab308" strokeDasharray="4 2" strokeWidth={1.5}
                  label={{value:'limiar',fill:'#eab308',fontSize:9,position:'insideTopRight'}}/>
              </>}
              <XAxis dataKey="l" tick={{fill:'#374151',fontSize:9}} tickLine={false} axisLine={false}
                interval={Math.floor(cd.length/5)}/>
              <YAxis domain={[yMn,yMx]} tick={{fill:'#374151',fontSize:9}} tickLine={false} axisLine={false}
                tickFormatter={v=>fmtVal(mainK,v)} width={44}/>
              <Tooltip content={TT}/>
              <Area type="monotone" dataKey="v" stroke={clr} strokeWidth={2.5}
                fill="url(#mainG)" dot={false}
                activeDot={{r:5,fill:clr,stroke:'#080d1a',strokeWidth:2}}/>
            </AreaChart>
          : <BarChart data={cd} margin={{top:6,right:4,left:0,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,.03)" vertical={false}/>
              {thr!==undefined && <ReferenceLine y={thr} stroke="#eab308" strokeDasharray="4 2" strokeWidth={1.5}/>}
              <XAxis dataKey="l" tick={{fill:'#374151',fontSize:9}} tickLine={false} axisLine={false}
                interval={Math.floor(cd.length/5)}/>
              <YAxis domain={[yMn,yMx]} tick={{fill:'#374151',fontSize:9}} tickLine={false} axisLine={false}
                tickFormatter={v=>fmtVal(mainK,v)} width={44}/>
              <Tooltip content={TT}/>
              <Bar dataKey="v" radius={[3,3,0,0]}>
                {cd.map((_,i)=>{
                  const gd=thr!==undefined?isGd(mainK,_.v):null;
                  const c=gd===null?'#0ea5e9':gd?'#10b981':'#ef4444';
                  return <Cell key={i} fill={c} fillOpacity={.85}/>;
                })}
              </Bar>
            </BarChart>
        }
      </ResponsiveContainer>
    </div>

    {/* Selector header */}
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <div>
        <div style={{fontSize:14,fontWeight:700,color:'#f1f5f9'}}>Indicadores</div>
        <div style={{fontSize:11,color:'#374151',marginTop:2}}>{selMini.length} gráficos selecionados</div>
      </div>
      <button onClick={()=>setShowSel(!showSel)} style={{
        padding:'6px 14px',borderRadius:8,border:'1px solid',fontSize:12,fontWeight:600,
        borderColor:showSel?'#0ea5e9':'#1e2d4a',
        background:showSel?'rgba(14,165,233,.12)':'transparent',
        color:showSel?'#0ea5e9':'#475569'
      }}>{showSel?'✕ Fechar':'＋ Selecionar'}</button>
    </div>

    {/* Selector Panel */}
    {showSel && <div className="card" style={{marginBottom:14}}>
      <input type="text" value={sSearch} onChange={e=>setSSearch(e.target.value)}
        placeholder="Filtrar indicadores..." style={{marginBottom:12,fontSize:13}}/>
      {BLOCOS.map(b=>{
        const grp=filtInds.filter(([_,v])=>v.bloco===b);
        if(!grp.length) return null;
        const bc=BLOCO_CLR[b];
        return <div key={b} style={{marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:800,color:bc,marginBottom:6,
            textTransform:'uppercase',letterSpacing:.8}}>{b}</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {grp.map(([k,v])=>{
              const sel=selMini.includes(k);
              return <button key={k} onClick={()=>toggleMini(k)} style={{
                padding:'4px 10px',borderRadius:20,border:'1px solid',fontSize:11,fontWeight:500,
                borderColor:sel?bc:'#1e2d4a',
                background:sel?`${bc}22`:'transparent',
                color:sel?bc:'#374151',transition:'all .15s'
              }}>{v.name}</button>;
            })}
          </div>
        </div>;
      })}
    </div>}

    {/* Mini Charts Grid */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      {selMini.map(k=><MiniChart key={k} k={k}/>)}
    </div>
  </div>;
}

// ── APP ───────────────────────────────────────────────────────────────────────

function App() {
  const [page,setPage]=useState('home');
  const [asset,setAsset]=useState(null);

  const nav=(to,data)=>{setAsset(data);setPage(to);window.scrollTo(0,0)};

  return <div>
    {page==='home' && <HomePage onNav={nav}/>}
    {page==='asset' && <AssetPage {...asset} onBack={()=>setPage('home')}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
